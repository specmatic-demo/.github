name: Specmatic Report for all projects

on:
  push:
    branches:
      - main
  schedule:
    - cron: "10 0 * * *" # Runs daily at 10 past midnight
  workflow_dispatch:

jobs:
  send-report:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web-frontend/package-lock.json

      - name: Initialize Specmatic License and Download Specmatic Enterprise
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p ~/.specmatic
          echo "${{ secrets.SPECMATIC_LICENSE_KEY }}" > ~/.specmatic/specmatic-license.txt
          curl -fsSL https://docs.specmatic.io/install-specmatic-enterprise.sh | bash

      - name: Run contract tests, backward compatibility checks and send reports
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -alh
          if [ $((RANDOM % 2)) -eq 0 ]; then
            export SPECMATIC_GENERATIVE_TESTS=true
          fi
          ./all-self-loop-test.sh || true
          npm ci --prefix web-frontend
          bash ./run-backward-compatibility-check.sh --send-reports || true
