name: Specmatic Report for all projects

on:
  push:
    branches:
      - main
  schedule:
    - cron: "10 0 * * *" # Runs daily at 10 past midnight
  workflow_dispatch:

jobs:
  send-report:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Initialize Specmatic License and Download Specmatic Enterprise
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p ~/.specmatic
          echo "${{ secrets.SPECMATIC_LICENSE_KEY }}" > ~/.specmatic/specmatic-license.txt
          curl -fsSL https://docs.specmatic.io/install-specmatic-enterprise.sh | bash

      - name: Debug web-bff report upload
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          JAVA_OPTS: >-
            -Dspecmatic.logging.level=trace
            -Dspecmatic.logging.stdout.enabled=true
          SPECMATIC_LOG_LEVEL: DEBUG
          SPECMATIC_DEBUG: "true"
        run: |
          set -x
          ./project-self-loop-test.sh web-bff
